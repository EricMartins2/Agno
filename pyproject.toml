[project]
name = "meu-projeto-agno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=3.1.0",
    "chonkie>=1.7.0",
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "fastembed>=0.9.0",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "openai>=3.24.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.65.0",
    "tavily-python>=0.8.4",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
    "yfinance>=1.7.0",
]

[project.scripts]
agno = "agno:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
